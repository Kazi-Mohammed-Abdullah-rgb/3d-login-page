<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">

    <!-- Tabs -->
    <div class="tabs" role="tablist">
      <span class="tab-indicator" aria-hidden="true"></span>
      <button class="tab active" role="tab" id="tab-login" aria-selected="true" aria-controls="login-form" data-target="login">Login</button>
      <button class="tab" role="tab" id="tab-signup" aria-selected="false" aria-controls="signup-form" data-target="signup">Sign Up</button>
    </div>

    <!-- Login form -->
    <form class="form active" id="login-form" role="tabpanel" aria-labelledby="tab-login">
      <h1>Welcome Back</h1>
      <p class="subtitle">Please enter your details to sign in.</p>

      <label for="login-email">Email Address</label>
      <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required>

      <label for="login-password">Password</label>
      <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password" required>

      <div class="row">
        <label class="check">
          <input type="checkbox">
          <span class="box"></span>
          Remember me
        </label>
        <a href="#" class="link">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-primary">Sign In <span aria-hidden="true">→</span></button>

      <div class="divider"><span>OR</span></div>

      <div class="social">
        <button type="button" class="btn-social">
          <svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
            <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
          Google
        </button>
        <button type="button" class="btn-social">
          <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          GitHub
        </button>
      </div>
    </form>

    <!-- Sign up form -->
    <form class="form" id="signup-form" role="tabpanel" aria-labelledby="tab-signup" hidden>
      <h1>Create an Account</h1>
      <p class="subtitle">Start your 30-day free trial today.</p>

      <label for="su-name">Full Name</label>
      <input type="text" id="su-name" placeholder="John Doe" autocomplete="name" required>

      <label for="su-email">Email Address</label>
      <input type="email" id="su-email" placeholder="you@example.com" autocomplete="email" required>

      <label for="su-password">Password</label>
      <input type="password" id="su-password" placeholder="Create a password" autocomplete="new-password" minlength="8" required>

      <label for="su-confirm">Confirm Password</label>
      <input type="password" id="su-confirm" placeholder="Confirm your password" autocomplete="new-password" minlength="8" required>
      <p class="error" id="su-error" role="alert"></p>

      <button type="submit" class="btn-primary">Create Account <span aria-hidden="true">→</span></button>

      <div class="divider"><span>OR</span></div>

      <div class="social">
        <button type="button" class="btn-social">
          <svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
            <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
          Google
        </button>
        <button type="button" class="btn-social">
          <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          GitHub
        </button>
      </div>
    </form>

  </main>

  <script>
    const tabs = document.querySelectorAll('.tab');
    const indicator = document.querySelector('.tab-indicator');
    const forms = { login: document.getElementById('login-form'), signup: document.getElementById('signup-form') };

    tabs.forEach((tab, i) => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
        tab.classList.add('active');
        tab.setAttribute('aria-selected', 'true');
        indicator.style.transform = `translateX(${i * 100}%)`;

        Object.entries(forms).forEach(([key, form]) => {
          const show = key === tab.dataset.target;
          form.hidden = !show;
          form.classList.toggle('active', show);
        });
      });
    });

    // Sign-up: password match check
    forms.signup.addEventListener('submit', e => {
      e.preventDefault();
      const error = document.getElementById('su-error');
      const ok = document.getElementById('su-password').value === document.getElementById('su-confirm').value;
      error.textContent = ok ? '' : 'Passwords do not match.';
    });

    // Login: connect to your backend here
    forms.login.addEventListener('submit', e => e.preventDefault());
  </script>
</body>
</html>
